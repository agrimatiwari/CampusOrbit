<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CampusRoutes – Smart Pedestrian Navigation Platform for Thapar Institute of Engineering & Technology (TIET), Patiala.">
    <title>CampusRoutes – Smart Campus Navigation | TIET Patiala</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="brand-badge" aria-hidden="true">CR</span>
            <div>
                <h1 class="brand-title">CampusRoutes</h1>
                <p class="brand-subtitle">TIET Patiala Pedestrian Navigation</p>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" id="reset-map-view-btn" class="btn btn-secondary" aria-label="Center map on TIET campus">
                Center Campus
            </button>
            <button type="button" id="theme-toggle-btn" class="btn btn-secondary" aria-label="Toggle dark or light theme">
                Theme
            </button>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar" aria-label="Campus search and route planner">
            <div id="status-banner" class="status-banner" role="status" aria-live="polite" hidden></div>

            <!-- Location Discovery -->
            <section class="panel-section" aria-labelledby="explore-heading">
                <h2 id="explore-heading" class="section-title">Find Campus Location</h2>
                <div class="search-box-wrapper">
                    <label for="explore-search-input" class="visually-hidden">Search buildings, hostels, or landmarks</label>
                    <input
                        type="search"
                        id="explore-search-input"
                        class="text-input"
                        placeholder="Search C Block, COS, Hostel J, Library..."
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-controls="explore-search-results"
                    >
                    <div id="explore-search-results" class="search-dropdown" role="listbox" aria-label="Matching campus locations" hidden></div>
                </div>

                <div id="category-filter-bar" class="category-chips" role="group" aria-label="Filter locations by category">
                    <button type="button" class="chip is-active" data-category="all" aria-pressed="true">All</button>
                    <button type="button" class="chip" data-category="academic" aria-pressed="false">Academic</button>
                    <button type="button" class="chip" data-category="hostel" aria-pressed="false">Hostels</button>
                    <button type="button" class="chip" data-category="dining" aria-pressed="false">Dining</button>
                    <button type="button" class="chip" data-category="sports" aria-pressed="false">Sports</button>
                    <button type="button" class="chip" data-category="admin" aria-pressed="false">Admin</button>
                    <button type="button" class="chip" data-category="medical" aria-pressed="false">Medical</button>
                    <button type="button" class="chip" data-category="gate" aria-pressed="false">Gates</button>
                </div>
            </section>

            <!-- Pedestrian Route Planner -->
            <section class="panel-section" aria-labelledby="routing-heading">
                <div class="section-header-row">
                    <h2 id="routing-heading" class="section-title">Pedestrian Directions</h2>
                    <div class="route-controls-inline">
                        <button type="button" id="swap-locations-btn" class="btn-icon" title="Swap start and destination" aria-label="Swap starting point and destination">
                            ⇅
                        </button>
                        <button type="button" id="clear-route-btn" class="btn-link" aria-label="Clear active route">
                            Clear
                        </button>
                    </div>
                </div>

                <div class="search-box-wrapper">
                    <label for="origin-input" class="input-label">From (Start)</label>
                    <input
                        type="search"
                        id="origin-input"
                        class="text-input"
                        placeholder="Choose starting building or gate..."
                        autocomplete="off"
                    >
                    <div id="origin-search-results" class="search-dropdown" role="listbox" aria-label="Starting location options" hidden></div>
                </div>

                <div class="search-box-wrapper">
                    <label for="destination-input" class="input-label">To (Destination)</label>
                    <input
                        type="search"
                        id="destination-input"
                        class="text-input"
                        placeholder="Choose destination..."
                        autocomplete="off"
                    >
                    <div id="destination-search-results" class="search-dropdown" role="listbox" aria-label="Destination location options" hidden></div>
                </div>

                <div id="route-summary" class="route-summary" hidden>
                    <div class="route-metrics">
                        <strong id="route-distance">0 m</strong>
                        <span aria-hidden="true">•</span>
                        <span id="route-duration">0 min walk</span>
                    </div>
                    <button type="button" id="toggle-alt-route-btn" class="btn btn-secondary btn-sm" hidden>
                        Show Alternative Path
                    </button>
                </div>

                <ol id="route-steps-list" class="route-steps-list" aria-label="Turn-by-turn walking instructions"></ol>
            </section>
        </aside>

        <main class="map-workspace">
            <div id="campus-map" role="region" aria-label="Interactive TIET campus pedestrian map"></div>

            <!-- Selected Location Info Card -->
            <article id="location-detail-card" class="location-card" aria-live="polite" hidden>
                <div class="location-card-header">
                    <div>
                        <span class="location-badge" data-field="category"></span>
                        <h3 class="location-card-title" data-field="name"></h3>
                    </div>
                    <button type="button" class="btn-icon" data-action="close-card" aria-label="Close location details">✕</button>
                </div>
                <p class="location-card-desc" data-field="description"></p>
                <p class="location-card-hours" data-field="hours"></p>
                <div class="location-card-actions">
                    <button type="button" class="btn btn-primary btn-sm" data-action="set-origin">Start Here</button>
                    <button type="button" class="btn btn-primary btn-sm" data-action="set-destination">Navigate Here</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-action="toggle-favorite" aria-pressed="false">☆ Save</button>
                </div>
            </article>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="js/locations.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/search.js"></script>
    <script src="js/routing.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
